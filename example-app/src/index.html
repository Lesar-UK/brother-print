<!doctype html>
<html lang="en" dir="ltr" class="hydrated">
  <head>
    <meta charset="UTF-8" />
    <title>Example Capacitor App</title>
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <main>
      <h1>Capacitor Test Plugin Project</h1>
      <p>
        This project can be used to test out the functionality of your plugin. Nothing in the
        <em>example-app/</em> folder will be published to npm when using this template, so you can create away!
      </p>
      <label for="deviceIdentifier">Printer:</label>
      <input type="text" id="deviceIdentifier" name="deviceIdentifier" placeholder="Printer Identifier" />
      <select id="printMethod" name="printMethod">
        <option value="wifi" selected>Wifi</option>
        <option value="bluetooth">Bluetooth</option>
      </select>
      <button onclick="base64Print()">Print Base64 Image!</button>
      <button onclick="base64PdfPrint()">Print PDF!</button>

      <hr>
      <button onclick="searchWifiPrinters()">Check WIFI Printers (Console Log)!</button>

      <hr>
      <button onclick="searchBluetoothPrinters()">Check Bluetooth Printers (Console Log)!</button>

      <hr>
      <button onclick="checkPrinterStatus()">Check Printer Status!</button>
    </main>

    <script src="./js/example.js" type="module"></script>
  </body>
</html>
